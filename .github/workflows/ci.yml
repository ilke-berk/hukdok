# Faz 2 — Regresyon Ağı CI (docs/arsiv/gelistirme-plani-2026-07-07.md §2.3)
#
# İki bağımsız job: backend (pytest) + frontend (tsc, vitest, build).
# Merge kapısı için GitHub'da branch protection ayarı gerekir (manuel adım):
#   Settings → Branches → main → Require status checks: backend, frontend
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # İki iş görür: (1) saf birim testleri DB'ye bağlanmaz ama database.py
      # import'ta postgresql:// URL şartı arar, (2) tests/test_migration_path.py
      # (G031) bu URL'den scratch veritabanı yaratıp gerçek migrasyon yolunu
      # koşar — servis kullanıcısı `postgres` superuser olduğu için
      # CREATE/DROP DATABASE yetkisi var. Ulaşılamazsa o testler SKIP olur.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hukudok_test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hukudok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Dockerfile prod imajıyla aynı sürüm (python:3.12-slim)
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt -r requirements-dev.txt

      # ADR-013 K3 — audit-ignore.txt satırları "Gözden geçirme: YYYY-MM-DD"
      # taşır; süresi geçmiş satır varsa kapı ignore'u sessizce kalıcılaştırmak
      # yerine kırmızıya döner (ignore ya gerçekten kapanır ya insan bilinçli uzatır).
      - name: audit-ignore.txt tarih kapısı
        run: |
          today=$(date +%Y-%m-%d)
          expired=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            review=$(echo "$line" | grep -oP 'Gözden geçirme: \K[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
            if [ -z "$review" ]; then
              echo "audit-ignore.txt satırında tarih yok: $line"
              expired=1
              continue
            fi
            if [[ "$review" < "$today" ]]; then
              echo "SÜRESİ GEÇMİŞ ignore satırı (gözden geçirilmeli): $line"
              expired=1
            fi
          done < audit-ignore.txt
          [ "$expired" -eq 0 ]

      # Argümansız pip-audit KURULU ortamı tarar (requirements.txt +
      # requirements-dev.txt'in tamamı, transitif kapanış dahil) — ADR-013 K3.
      - name: pip-audit
        run: |
          IGNORE_ARGS=$(grep -v '^\s*#' audit-ignore.txt | grep -v '^\s*$' | awk '{print "--ignore-vuln " $1}' | tr '\n' ' ')
          pip-audit --strict $IGNORE_ARGS

      - name: ruff (Faz 3.1)
        run: ruff check .

      - name: mypy (Faz 3.1 — managers/ + routes/)
        run: mypy

      # Kapsam kapısı bir HEDEF değil, gerilemeyi yakalayan TABANdır.
      # Eşik 58: 2026-08-12'de ölçülen %60,03'ün 2 puan altı (G030). Ölçüm
      # ayarı backend/pyproject.toml [tool.coverage.run] (tests/ + scripts/ hariç).
      # --cov bayrakları bilinçli olarak addopts'a değil BURAYA yazılır: lokal
      # koşuyu yavaşlatmasın ve pytest-cov'suz konteynerde pytest kırılmasın.
      - name: pytest (kapsam kapısı)
        run: pytest --cov=. --cov-report=term-missing:skip-covered --cov-fail-under=58

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Dockerfile builder imajıyla aynı sürüm (node:24)
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        # legacy-peer-deps .npmrc'den gelir (React 18 + MSAL v5)
        run: npm ci

      # ADR-013 K3 — prod tarafı bloklayıcı kapı. npm'in kendi CLI'ında
      # --ignore-vuln yok; scripts/check-npm-audit.mjs audit-ignore.txt'e
      # (tarihli, gerekçeli) karşı denetler — bkz. o dosyanın başlığı.
      - name: npm audit (prod, audit-ignore.txt ile)
        run: node scripts/check-npm-audit.mjs

      # Geliştirme zinciri (vite/esbuild/rollup) ARTIK BLOKLAYICI (G089).
      # Bekleme sebebi vite majör geçişiydi; vite 6.4.3 ile ağacın tamamı
      # (dev dahil) 0 açık — `|| true` düştü. Gerekçe: geliştirme makinesinin
      # dosya sistemi de bir saldırı yüzeyi (2026-08-22 denetimi B-1:
      # server.fs.deny bypass + esbuild cross-origin okuma), bkz. ADR-013 K3.
      # DİKKAT: bu adım audit-ignore.txt'i OKUMAZ. Prod tarafına tarihli bir
      # ignore satırı eklenirse burası yine kırmızı olur — o gün bu adım da
      # aynı listeyi okuyacak şekilde (check-npm-audit.mjs) öğretilmeli.
      - name: npm audit (geliştirme zinciri dahil — bloklayıcı)
        run: npm audit --audit-level=moderate

      - name: ESLint (Faz 3.2'den beri zorunlu)
        run: npm run lint

      # ÇIPLAK `npx tsc --noEmit` BU REPODA SAHTE BİR KAPIDIR (G026 bulgusu, G037'de
      # kanıtlandı): kök tsconfig.json solution-style'dır (`"files": []` + references),
      # dolayısıyla tsc hiçbir dosya bulamaz ve tip hatası dururken bile exit 0 döner.
      # `-b` referansları GERÇEKTEN izler → hem tsconfig.app.json (src/) hem
      # tsconfig.node.json (vite.config.ts) denetlenir. `--force` inkremental
      # "up to date" atlamasını kapatır (CI temiz checkout'ta da niyeti açık tutar).
      - name: TypeScript kontrolü
        run: npx tsc -b --force

      - name: vitest
        run: npm test

      - name: Build
        run: npm run build
