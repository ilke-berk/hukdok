services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: hukudok-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: hukudok
      POSTGRES_USER: hukudok_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    # Bellek/log sınırları (Faz 1-A): önceden yalnız sunucudaki gitignore'lu
    # override'da / daemon.json'daydı — VM kaybında konfig repo'dan geri gelsin.
    # memswap=mem → swap yok: swap'a taşma, 2026-07-29 kesintilerindeki I/O
    # fırtınasının mekanizmasıydı (tüm servislerde aynı kural).
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hukudok_user -d hukudok" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hukudok-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # deploy.sh export eder (git SHA); elle build'de "dev" düşer.
        APP_VERSION: ${APP_VERSION:-dev}
    # Paylaşılan network'te "backend" adı fazla genel; hukukbot bu isimle
    # bağlanır: http://hukdok_backend:8001 (BULGULAR #10)
    container_name: hukdok_backend
    ports:
      # localhost'a sabitli: API-key'li /export route'ları public porttan
      # erişilememeli (BULGULAR #11). Host nginx localhost'tan proxy'ler,
      # hukukbot iç Docker network'ünden konuşur.
      - "127.0.0.1:8001:8001"
    volumes:
      # Persistent volume for database (production)
      - backend-data:/app/data
      # Kaynak kod mount'u YOK (G6): prod imajdaki kodu çalıştırır. Lokal
      # geliştirmede hot-reload için docker-compose.override.yml kullanılır
      # (bkz. docker-compose.override.yml.example — gitignore'da, prod'a gitmez).
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring
      - PORT=8001 # Override default port
      # glibc thread başına ayrı malloc arena açar; PDF/görüntü dönüşümünün dev
      # geçici tahsisleri arena'larda kalıp RSS'i kalıcı yükseltiyordu
      # (2026-07-29 OOM incelemesi). 2 arena, 2 vCPU için yeterli.
      - MALLOC_ARENA_MAX=2
    # Load environment variables from backend/.env if it exists, or root .env
    env_file:
      - .env
    restart: unless-stopped
    # 2026-07-29/30 OOM incelemesi: backend'in anon bellek büyümesi VM'i
    # kilitliyordu. Limit aşımında konteyner OOM-kill edilir ve restart olur —
    # tüm VM'in ağ/SSH kaybetmesinden iyidir. memswap=mem → swap kullanmaz.
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      # curl imajda yok (python:slim) — stdlib urllib yeterli. urlopen HTTP>=400'de
      # exception fırlatır → non-zero exit → unhealthy. $$: compose'un kendi
      # interpolasyonundan kaçış; ${PORT:-8001} konteyner kabuğunda açılır.
      # Faz 2-A: /healthz artık derin — DB SELECT 1 başarısızsa 503 döner,
      # konteyner "unhealthy" görünür (Docker restart ETMEZ, yalnız işaretler;
      # frontend depends_on yalnız İLK ayağa kalkışta bunu bekler).
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:$${PORT:-8001}/healthz', timeout=5)\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hukudok-network
      - hukuk_shared

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Login rozetindeki sürüm (VITE_APP_VERSION olarak bundle'a gömülür)
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "8080:80"
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hukudok-network

# Named volumes for persistence
volumes:
  backend-data:
    driver: local
  postgres-data:
    driver: local

# Network for inter-service communication
networks:
  hukudok-network:
    driver: bridge
  # Hukukbot ile ortak external network (Faz 4). Önceden oluşturulmalı:
  #   docker network create hukuk_shared
  hukuk_shared:
    external: true
