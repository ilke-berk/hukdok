map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~." $http_x_forwarded_proto;
}

server {
    client_max_body_size 50M;
    listen 80;

    # GhostScript PDF/A donusumu 60s'yi asabiliyor; default 60s ile /confirm
    # 504 donuyordu ama backend islemi tamamliyordu (mukerrer kayit kaynagi).
    # Host nginx zaten 300s — iki katman esit olmali.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # SPA varliklari sikistirilmadan gidiyordu: ana JS chunk'i 1.324.033 bayt ham,
    # gzip'li karsiligi 361.003 bayt (~%73 tasarruf). Repoda baska bir katmanda
    # gzip yapildigina dair konfig yok — burada aciyoruz.
    gzip on;
    gzip_vary on;          # ara cache'ler Accept-Encoding'e gore ayirsin
    gzip_comp_level 5;     # CPU/oran dengesi; 6+ kazanci marjinal, CPU'yu buyutur
    gzip_min_length 1024;  # kucuk yanitlarda gzip cercevesi kazanci yer
    gzip_proxied any;
    # Zaten sikistirilmis tipler (jpg/png/pdf/woff2) BILEREK listede yok — tekrar
    # sikistirmak CPU harcar, boyutu buyutur. text/html varsayilan olarak dahildir,
    # yazilirsa "duplicate MIME type" uyarisi verir.
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # Onbellek (G182): SPA artik route basina parcalara bolunuyor (App.tsx React.lazy).
    # Vite ciktisi /assets/ altinda ICERIK HASH'LI adlarla gelir -> 1 yil
    # "public, max-age=31536000, immutable" (asagidaki location ~* ^/assets/).
    # index.html ve diger hash'siz dosyalar "no-cache": her acilista ETag ile
    # yeniden dogrulanir (304), deploy sonrasi yeni parca adlari hemen gelir.
    # Oncesinde hicbir Cache-Control yoktu (her acilista yeniden dogrulama).
    # PROD'DA DOGRULANACAK: TLS'i sonlandiran host nginx (konfigi repo DISINDA) bu
    # basliklari ezip ezmedigi ya da kendi Cache-Control'unu ekleyip eklemedigi —
    # `curl -sI https://<alan>/assets/<parca>.js` ve `curl -sI https://<alan>/`
    # (docs/arsiv/performans-denetimi-2026-09-14.md F14).
    # DIKKAT (add_header kalitimi): bir location icinde TEK bir add_header bile
    # varsa server duzeyindeki add_header'lar o blokta DUSER. Bu yuzden asagidaki
    # guvenlik basliklari Cache-Control ekleyen iki location'da AYNEN tekrar
    # yazilir; birini degistiren UCUNU birden degistirir.

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP — ZORLAYICI (G101). G091 Report-Only koymustu; 2026-08-22 ihlal turu
    # (login, pano, upload, cases, clients, activity-history, admin, tema, zil) ile
    # script/style/font/img/frame-src'de 0 ihlal olculdu, inline yazdirma popup'lari
    # G100'de kapatildi; ardindan yalniz baslik adi degisti, politika metni aynidir.
    # Ihlal gorulurse geri donus: baslik adina -Report-Only ekini geri koy
    # (tek satir, frontend imaji rebuild ister). Ayrinti: docs/mimari/deploy-ve-altyapi.md §11.
    # Kaynaklarin gerekcesi: style/font -> Google Fonts (index.html:53-55),
    # connect+frame -> MSAL sessiz token yenileme iframe'i (src/config/msalConfig.ts:12),
    # img blob: -> URL.createObjectURL ile uretilen indirme/onizleme baglantilari.
    # style-src'teki 'unsafe-inline' bilincli: Radix/Tailwind bilesenleri calisma
    # zamaninda inline stil enjekte ediyor; daraltmasi ayri bir istir.
    # G182: bu CSP satiri asagidaki /assets/ ve / location'larinda da AYNEN tekrarlanir.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Hash'li Vite parcalari (G182). Eksik parca index.html'e DUSMEZ (=404):
    # aksi halde HTML, JS adresi altinda 1 yil immutable onbellege girerdi. 404,
    # acik kalmis eski sekmede frontend'in "sayfayi bir kez yenile" dalini tetikler
    # (frontend/src/lib/chunkReload.ts). Cache-Control bilerek 'always' DEGIL:
    # 404 yanitina immutable yazilmaz. Guvenlik basliklari kalitim kurali geregi tekrar.
    location ~* ^/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # index.html (SPA fallback dahil) her acilista yeniden dogrulanir (G182).
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # Derin sağlık ucu (Faz 2-A): GCP uptime check + dış izleme buradan girer.
    # Exact match şart — location / (SPA try_files) yutarsa backend ölüyken
    # bile 200 index.html döner ve izleme kör kalır (planın çıkış noktası).
    # Backend down → 502, DB down → backend 503 döndürür; ikisi de alarm demek.
    location = /healthz {
        proxy_pass http://backend:8001/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Optional: Proxy API requests if we want to serve everything on port 80
    # DIKKAT: /export buraya ASLA eklenmez — yalnizca ic Docker network'unden
    # erisilir, public'e proxy'lenmez (docs/hukukbot-aktarim/BULGULAR.md #5).
    location /api {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /process {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 50M;
    }

    location /confirm {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /preview-email-body {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Musteri/muvekkil bilgilendirme govdesi (routes/processing.py:347). Prefix
    # eslesmesi oldugu icin ustteki /preview-email-body bunu YAKALAMAZ; eksik
    # oldugunda istek SPA'ya (index.html) dusuyor ve frontend sessizce yanlis
    # tonlu fallback metnini gosteriyordu.
    location /preview-client-email-body {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /refresh {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
