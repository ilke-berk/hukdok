map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~." $http_x_forwarded_proto;
}

server {
    client_max_body_size 50M;
    listen 80;

    # GhostScript PDF/A donusumu 60s'yi asabiliyor; default 60s ile /confirm
    # 504 donuyordu ama backend islemi tamamliyordu (mukerrer kayit kaynagi).
    # Host nginx zaten 300s — iki katman esit olmali.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # SPA varliklari sikistirilmadan gidiyordu: ana JS chunk'i 1.324.033 bayt ham,
    # gzip'li karsiligi 361.003 bayt (~%73 tasarruf). Repoda baska bir katmanda
    # gzip yapildigina dair konfig yok — burada aciyoruz.
    gzip on;
    gzip_vary on;          # ara cache'ler Accept-Encoding'e gore ayirsin
    gzip_comp_level 5;     # CPU/oran dengesi; 6+ kazanci marjinal, CPU'yu buyutur
    gzip_min_length 1024;  # kucuk yanitlarda gzip cercevesi kazanci yer
    gzip_proxied any;
    # Zaten sikistirilmis tipler (jpg/png/pdf/woff2) BILEREK listede yok — tekrar
    # sikistirmak CPU harcar, boyutu buyutur. text/html varsayilan olarak dahildir,
    # yazilirsa "duplicate MIME type" uyarisi verir.
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP — BILEREK yalnizca Report-Only (G091). Bilinen bir XSS yolu yok (React
    # varsayilan kacisi, dangerouslySetInnerHTML hic kullanilmiyor); bu derinlemesine
    # savunmadir. Zorlayici basliga gecmeden once ihlal raporlari toplanmalidir:
    # index.html:38'deki inline <script type="application/ld+json"> blogunu
    # tarayicilarin script-src'e tabi tutup tutmadigi surume gore degisir, olcmeden
    # zorlayici yazmak sayfayi kirar.
    # Kaynaklarin gerekcesi: style/font -> Google Fonts (index.html:53-55),
    # connect+frame -> MSAL sessiz token yenileme iframe'i (src/config/msalConfig.ts:12),
    # img blob: -> URL.createObjectURL ile uretilen indirme/onizleme baglantilari.
    # style-src'teki 'unsafe-inline' bilincli: Radix/Tailwind bilesenleri calisma
    # zamaninda inline stil enjekte ediyor; daraltmasi ayri bir istir.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Derin sağlık ucu (Faz 2-A): GCP uptime check + dış izleme buradan girer.
    # Exact match şart — location / (SPA try_files) yutarsa backend ölüyken
    # bile 200 index.html döner ve izleme kör kalır (planın çıkış noktası).
    # Backend down → 502, DB down → backend 503 döndürür; ikisi de alarm demek.
    location = /healthz {
        proxy_pass http://backend:8001/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Optional: Proxy API requests if we want to serve everything on port 80
    # DIKKAT: /export buraya ASLA eklenmez — yalnizca ic Docker network'unden
    # erisilir, public'e proxy'lenmez (docs/hukukbot-aktarim/BULGULAR.md #5).
    location /api {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /process {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 50M;
    }

    location /confirm {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /preview-email-body {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Musteri/muvekkil bilgilendirme govdesi (routes/processing.py:347). Prefix
    # eslesmesi oldugu icin ustteki /preview-email-body bunu YAKALAMAZ; eksik
    # oldugunda istek SPA'ya (index.html) dusuyor ve frontend sessizce yanlis
    # tonlu fallback metnini gosteriyordu.
    location /preview-client-email-body {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /refresh {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
