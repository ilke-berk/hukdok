[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# E: pycodestyle hataları (E722 bare-except dahil), F: pyflakes, B: bugbear
select = ["E", "F", "B"]
# E501: mevcut kodda uzun satır yaygın; satır boyu kapısı Faz 3 kapsamı dışı
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# E402: bu modüllerde import'lardan ÖNCE env yükleme / startup log / sys.path
# kurulumu bilinçli olarak yapılır; import sırası davranışın parçası.
"analyzer.py" = ["E402"]
"api.py" = ["E402"]
"client_normalizer.py" = ["E402"]
"vault.py" = ["E402"]
"managers/cache_manager.py" = ["E402"]
"managers/log_manager.py" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI'nin Depends/Query/... default-argüman deyimi B008 değildir
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body",
    "fastapi.File", "fastapi.Form", "fastapi.Path", "fastapi.Cookie",
    "fastapi.Security", "Depends", "Query", "Header", "Body", "File",
    "Form", "Path", "Cookie", "Security",
]

# Mypy kademeli (plan §3.1): yalnızca aşağıdaki paketler taranır, strict
# hedeflenmez. Kapsam genişletmek için files listesine modül ekleyin — kademe
# kademe: bir kademe açılırken o kademenin TÜM hataları kapatılır (G035'te
# services/ böyle eklendi, 25 hata tip daraltmasıyla kapandı).
# DİKKAT: kökü birden taramak (`mypy .`) bugün modül-yolu çakışmasında patlar
# (schemas_intake.py duplicate module name); ayrı bir iş.
[tool.mypy]
python_version = "3.12"
files = ["managers", "routes", "config", "services"]
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
# Kod tabanında `param: str = None` stili yaygın; Optional'a geçiş kademeli
implicit_optional = true
# SQLAlchemy eski stil Column() modellerinde instance ataması mypy'de
# false-positive [assignment] üretir; modeller Mapped[]'e geçince (Faz 4) açılacak
disable_error_code = ["assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Uygulama modülleri backend kökünden import edilir (import zinciri /app'e göre)
pythonpath = ["."]
# DİKKAT: --cov bayrakları buraya GİRMEZ. İki sebep: (1) lokal koşuyu yavaşlatır,
# (2) pytest-cov prod imajında yoktur (requirements-dev.txt) — addopts'a girerse
# dev araçsız konteynerde `python -m pytest` "unrecognized arguments" ile ölür.
# Kapsam yalnız CI adımında ölçülür (.github/workflows/ci.yml).
addopts = "-q"
# dbtest: gerçek Postgres'e bağlanan testler (tests/test_migration_path.py).
# İşaretsiz koşuda DA çalışırlar — DB'ye ulaşılamıyorsa kendileri SKIP olur;
# bilinçli dışlamak için: pytest -m "not dbtest".
markers = [
    "dbtest: gerçek bir PostgreSQL sunucusuna bağlanır (yoksa SKIP)",
]

# Kapsam ölçümü uygulama kodunu sayar; test ve yardımcı scriptler hariç.
[tool.coverage.run]
omit = [
    "tests/*",
    "scripts/*",
]
